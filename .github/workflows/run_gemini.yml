name: Run Gemini API Script

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài đặt thư viện
        run: python -m pip install --upgrade pip google-genai

      - name: Chạy script Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
